# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "56 5 * * 1,4"
      timezone: Etc/UTC
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: cron
      cronjob: "56 17 * * 1,4"
      timezone: Etc/UTC
